<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CareerTrack | Edit Application</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <aside class="sidebar">
        <h2>CareerTrack</h2>

        <nav>
            <a href="/">Dashboard</a>
            <a href="/applications" class="active">Applications</a>
            <a href="/add">Add Application</a>
            <a href="/settings">Settings</a>
        </nav>
    </aside>


    <main class="main-content">

        <header class="topbar">
            <div>
                <h1>Edit Application</h1>
                <p>Update your job application details.</p>
            </div>
        </header>


        <section class="applications">

            <form method="POST">

                <div class="form-group">
                    <label>Company Name *</label>
                    <input type="text" name="company"
                           value="{{ application['company'] }}" required>
                </div>

                <div class="form-group">
                    <label>Job Position *</label>
                    <input type="text" name="position"
                           value="{{ application['position'] }}" required>
                </div>

                <div class="form-group">
                    <label>Location</label>
                    <input type="text" name="location"
                           value="{{ application['location'] or '' }}">
                </div>

                <div class="form-group">
                    <label>Job Type</label>
                    <select name="job_type">
                        <option value="Full Time"
                            {% if application['job_type'] == 'Full Time' %}selected{% endif %}>
                            Full Time
                        </option>

                        <option value="Part Time"
                            {% if application['job_type'] == 'Part Time' %}selected{% endif %}>
                            Part Time
                        </option>

                        <option value="Internship"
                            {% if application['job_type'] == 'Internship' %}selected{% endif %}>
                            Internship
                        </option>

                        <option value="Contract"
                            {% if application['job_type'] == 'Contract' %}selected{% endif %}>
                            Contract
                        </option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Salary</label>
                    <input type="text" name="salary"
                           value="{{ application['salary'] or '' }}">
                </div>

                <div class="form-group">
                    <label>Applied Date</label>
                    <input type="date" name="applied_date"
                           value="{{ application['applied_date'] or '' }}">
                </div>

                <div class="form-group">
                    <label>Status *</label>
                    <select name="status" required>
                        <option value="Applied"
                            {% if application['status'] == 'Applied' %}selected{% endif %}>
                            Applied
                        </option>

                        <option value="Interview"
                            {% if application['status'] == 'Interview' %}selected{% endif %}>
                            Interview
                        </option>

                        <option value="Pending"
                            {% if application['status'] == 'Pending' %}selected{% endif %}>
                            Pending
                        </option>

                        <option value="Selected"
                            {% if application['status'] == 'Selected' %}selected{% endif %}>
                            Selected
                        </option>

                        <option value="Rejected"
                            {% if application['status'] == 'Rejected' %}selected{% endif %}>
                            Rejected
                        </option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Job URL</label>
                    <input type="url" name="job_url"
                           value="{{ application['job_url'] or '' }}">
                </div>

                <div class="form-group">
                    <label>Contact Person</label>
                    <input type="text" name="contact_person"
                           value="{{ application['contact_person'] or '' }}">
                </div>

                <div class="form-group">
                    <label>Interview Date</label>
                    <input type="date" name="interview_date"
                           value="{{ application['interview_date'] or '' }}">
                </div>

                <div class="form-group">
                    <label>Follow-up Date</label>
                    <input type="date" name="follow_up_date"
                           value="{{ application['follow_up_date'] or '' }}">
                </div>

                <div class="form-group">
                    <label>Notes</label>
                    <textarea name="notes" rows="5">{{ application['notes'] or '' }}</textarea>
                </div>

                <button type="submit" class="add-btn">
                    Update Application
                </button>

            </form>

        </section>

    </main>

</body>
</html>
